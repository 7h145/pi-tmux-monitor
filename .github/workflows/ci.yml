name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.19.0", "26.10.0"]
    env:
      PI_MONITOR_COMPOSITOR: ${{ github.workspace }}/.ci-deps/pi-footer-compositor/pi-footer-compositor.ts
      PI_MONITOR_REQUIRE_COMPOSITOR: "1"
      PI_OFFLINE: "1"
      PI_TELEMETRY: "0"
      TERM: xterm-256color
    steps:
      - name: Check out monitor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out compositor
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: 7h145/pi-footer-compositor
          ref: e3ef5d9b0143f28b990cb300f4ef42a019f4874b
          path: .ci-deps/pi-footer-compositor
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            test/host/package-lock.json

      - name: Install tmux
        run: |
          sudo apt-get update
          sudo apt-get install --yes tmux
          tmux -V

      - name: Install test dependencies
        run: |
          npm ci --prefix test/host --ignore-scripts --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/test/host/node_modules/.bin" >> "$GITHUB_PATH"
          export PI_MONITOR_HOST_ROOT="$GITHUB_WORKSPACE/test/host/node_modules/@earendil-works/pi-coding-agent"
          echo "PI_MONITOR_HOST_ROOT=$PI_MONITOR_HOST_ROOT" >> "$GITHUB_ENV"
          npm ci --legacy-peer-deps --ignore-scripts
          node test/setup-peers.mjs

      - name: Type-check and test
        run: npm run check

      - name: Check package contents
        run: npm pack --dry-run
